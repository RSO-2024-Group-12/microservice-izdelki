# HTTP
quarkus.http.port=8080

# Microservice url
skladisce.url=http://localhost:8082/v1/skladisce

# PostgreSQL Configuration
quarkus.datasource.db-kind=postgresql
quarkus.datasource.health.enabled=true

# Hibernate ORM
quarkus.hibernate-orm.database.generation=drop-and-create
quarkus.hibernate-orm.log.sql=false
quarkus.hibernate-orm.packages=si.nakupify.entity

# GraphQL
quarkus.smallrye-graphql.ui.always-include=true

# OpenAPI Info
quarkus.smallrye-openapi.info-title=Katalog izdelkov
quarkus.smallrye-openapi.info-version=1.0.0
quarkus.smallrye-openapi.info-description=Mikrostoritev za upravljanje izdelkov.
quarkus.smallrye-openapi.info-license-name=Apache 2.0
quarkus.smallrye-openapi.info-license-url=https://www.apache.org/licenses/LICENSE-2.0.html

# Swagger UI
quarkus.swagger-ui.always-include=true